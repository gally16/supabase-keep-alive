name: Supabase Keep-Alive

on:
  workflow_dispatch: # 允许手动触发
  schedule:
    # Cron 表达式，表示在每周一和周四的 UTC 时间 5:30 运行
    # 你可以根据需要修改，但一周 1-2 次足矣
    - cron: '30 5 * * 1,4'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 在这里定义你的所有项目，这里的名字需要和你设置的 Secrets 后缀对应
        project: ['PROJ1', 'PROJ2', 'BLOG']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Supabase Keep-Alive Script for ${{ matrix.project }}
        env:
          # 动态地从 Secrets 中读取 URL 和 KEY
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabaseUrl = process.env.SUPABASE_URL;
            const supabaseKey = process.env.SUPABASE_KEY;

            if (!supabaseUrl || !supabaseKey) {
              console.error('Supabase URL or Key is missing.');
              process.exit(1);
            }

            console.log('Pinging project at:', supabaseUrl.substring(0, 25) + '...');

            const supabase = createClient(supabaseUrl, supabaseKey);

            async function keepAlive() {
              // 执行一个非常轻量的查询，只查询元数据，不返回任何行
              // 这里的 'your_table_name' 需要换成你项目中实际存在的一个表名
              // 如果你不确定，可以查询 pg_catalog.pg_database，这是一个系统表，永远存在
              const { error, count } = await supabase.from('pg_catalog.pg_database').select('*', { count: 'exact', head: true });
              
              if (error) {
                console.error('Error pinging Supabase:', error.message);
                process.exit(1);
              } else {
                console.log('Successfully pinged project. DB count:', count);
              }
            }

            keepAlive();
          "
