name: Supabase Keep-Alive (Smart Scan)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */1 * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ['PROJ1', 'PROJ2', 'PROJ3', 'PROJ4']
        # ⚠️ 关键点：请确保这里的 'PROJ1', 'PROJ2' 等名字
        # 和你 GitHub Secrets 名称的后缀（如 SUPABASE_URL_PROJ1）完全一致！
        #PROJ1：n8npro-4755
        #PROJ2：n8-1512
        #PROJ3：umi-1512
        #PROJ4：@proton.me
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Smart Keep-Alive for ${{ matrix.project }}
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');

            const supabaseUrl = (process.env.SUPABASE_URL || '').trim();
            const supabaseKey = (process.env.SUPABASE_KEY || '').trim();

            if (!supabaseUrl || !supabaseKey) {
              console.error('❌ Missing URL or Key for project: ${{ matrix.project }}');
              process.exit(1);
            }

            const supabase = createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false },
              db: { schema: 'public' }
            });

            const candidates = [
              { type: 'table', name: 'live' },
              { type: 'table', name: 'users' },
              { type: 'table', name: 'profiles' },
              { type: 'table', name: 'todos' },
              { type: 'table', name: 'posts' },
              { type: 'table', name: 'projects' },
              { type: 'table', name: 'settings' },
              { type: 'table', name: 'items' },
              { type: 'table', name: 'orders' },
              { type: 'table', name: 'products' },
              { type: 'table', name: 'logs' },
              { type: 'table', name: 'comments' },
              { type: 'table', name: 'messages' },
              { type: 'table', name: 'events' },
              { type: 'table', name: 'tasks' },
              { type: 'table', name: 'notifications' },
              { type: 'table', name: 'tags' },
              { type: 'table', name: 'categories' },
              { type: 'table', name: 'teams' },
              { type: 'table', name: 'articles' },
              { type: 'table', name: 'audit_logs' },
              { type: 'storage', name: 'buckets' }
            ];

            async function queryTarget(target) {
              try {
                let result;
                if (target.type === 'storage') {
                  result = await supabase.storage.listBuckets();
                } else {
                  result = await supabase.from(target.name).select('id').limit(1);
                }
                const error = result.error;
                if (!error) return { ok: true, status: 'OK', detail: '' };

                const msg = error.message.toLowerCase();
                if (msg.includes('permission denied') || msg.includes('policy')) {
                  return { ok: true, status: 'OK (Access Denied)', detail: error.message };
                }
                if (msg.includes('does not exist') || msg.includes('404') || msg.includes('schema cache') || msg.includes('not found')) {
                  return { ok: false, status: 'NOT FOUND', detail: error.message };
                }
                if (msg.includes('fetch failed') || msg.includes('connection refused') || msg.includes('network')) {
                  return { ok: false, status: 'NETWORK ERROR', detail: error.message };
                }
                return { ok: true, status: 'OK (DB Responded)', detail: error.message };
              } catch (err) {
                return { ok: false, status: 'CRITICAL', detail: err.message };
              }
            }

            async function scanAll() {
              console.log('📡 Connecting to:', supabaseUrl);
              console.log('🔍 Phase 1: Scanning all targets...\n');

              const results = [];
              const successTargets = [];

              for (const target of candidates) {
                const res = await queryTarget(target);
                results.push({ ...target, ...res });

                const icon = res.ok ? '✅' : res.status === 'NOT FOUND' ? '⚠️' : '❌';
                console.log(icon + ' [' + target.type.toUpperCase().padEnd(7) + '] ' + target.name.padEnd(20) + ' → ' + res.status + (res.detail ? ' | ' + res.detail : ''));

                if (res.ok) {
                  successTargets.push(target);
                }
              }

              console.log('\n' + '─'.repeat(60));
              console.log('📊 Phase 1 Summary: ' + successTargets.length + ' success, ' + (candidates.length - successTargets.length) + ' failed, ' + candidates.length + ' total');
              console.log('─'.repeat(60));

              // Phase 2: 对成功的表再读取20遍
              if (successTargets.length > 0) {
                console.log('\n🔁 Phase 2: Re-querying ' + successTargets.length + ' successful target(s) 20 times each...\n');

                for (const target of successTargets) {
                  console.log('  📌 Target: [' + target.type + '] ' + target.name);
                  let targetSuccess = 0;
                  let targetFail = 0;

                  for (let i = 1; i <= 20; i++) {
                    const res = await queryTarget(target);
                    if (res.ok) {
                      targetSuccess++;
                      process.stdout.write('.');
                    } else {
                      targetFail++;
                      process.stdout.write('x');
                    }
                  }
                  console.log('  → ' + targetSuccess + '/20 OK, ' + targetFail + '/20 FAIL');
                }

                console.log('\n✅ Phase 2 complete. All successful targets queried 20 additional times.');
              }

              // 最终判断
              const liveResult = results.find(r => r.name === 'live');
              if (liveResult && liveResult.ok) {
                console.log('\n🛡️ Keep-alive confirmed: live table is accessible.');
              } else if (successTargets.length > 0) {
                console.log('\n🛡️ Keep-alive confirmed: ' + successTargets.length + ' target(s) responded.');
              } else {
                console.error('\n❌ Keep-alive failed! No targets responded.');
                process.exit(1);
              }
            }

            scanAll();
          "
