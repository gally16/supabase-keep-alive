name: Supabase Keep-Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['PROJ1', 'PROJ2', 'PROJ3', 'PROJ4']
        # ⚠️ 关键点：请确保这里的 'PROJ1', 'PROJ2' 等名字
        # 和你 GitHub Secrets 名称的后缀（如 SUPABASE_URL_PROJ1）完全一致！
        #PROJ1：n8npro-475525068
        #PROJ2：n8-151251860
        #PROJ3：umi-151251860
        #PROJ4：gally16@proton.me
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Supabase Keep-Alive Script for ${{ matrix.project }}
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            
            const supabaseUrl = (process.env.SUPABASE_URL || '').trim();
            const supabaseKey = (process.env.SUPABASE_KEY || '').trim();

            if (!supabaseUrl || !supabaseKey) {
              console.error('❌ Missing URL or Key. Please check GitHub Secrets.');
              process.exit(1);
            }

            console.log('📡 Connecting to:', supabaseUrl);

            const supabase = createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false }
            });

            async function keepAlive() {
              try {
                // ✅ 真正的保活：更新 keep_alive 表的一行数据
                // Upsert 操作：如果 id=1 存在则更新时间，不存在则插入
                // 这种“写操作”是 Supabase 判定活跃度的黄金标准
                const { data, error } = await supabase
                  .from('keep_alive')
                  .upsert({ id: 1, last_ping: new Date().toISOString() })
                  .select();

                if (error) {
                  throw error;
                }

                console.log('✅ Success! Database updated via Upsert.');
                console.log('📝 Response:', JSON.stringify(data));

              } catch (err) {
                console.error('❌ Error pinging Supabase:', err.message);
                
                // 错误排查提示
                if (err.message.includes('relation \"public.keep_alive\" does not exist')) {
                  console.error('⚠️ 致命错误：数据库中缺少 keep_alive 表。请去 Supabase SQL Editor 执行建表 SQL。');
                } else if (err.message.includes('fetch failed')) {
                  console.error('⚠️ 网络连接失败，可能是项目已被暂停。请先手动在后台恢复项目。');
                }
                process.exit(1);
              }
            }

            keepAlive();
          "
            keepAlive();
          "
