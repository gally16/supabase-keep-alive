name: Supabase Keep-Alive (Smart Scan)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 */1 * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ['PROJ1', 'PROJ2', 'PROJ3', 'PROJ4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Smart Keep-Alive for ${{ matrix.project }}
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            
            const supabaseUrl = (process.env.SUPABASE_URL || '').trim();
            const supabaseKey = (process.env.SUPABASE_KEY || '').trim();

            if (!supabaseUrl || !supabaseKey) {
              console.error('❌ Missing URL or Key for project: ${{ matrix.project }}');
              process.exit(1);
            }

            const supabase = createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false },
              db: { schema: 'public' }
            });

            const candidates = [
              { type: 'table', name: 'live' },
              { type: 'table', name: 'users' },
              { type: 'table', name: 'profiles' },
              { type: 'table', name: 'todos' },
              { type: 'table', name: 'posts' },
              { type: 'table', name: 'projects' },
              { type: 'table', name: 'settings' },
              { type: 'table', name: 'items' },
              { type: 'table', name: 'orders' },
              { type: 'table', name: 'products' },
              { type: 'table', name: 'logs' },
              { type: 'table', name: 'comments' },
              { type: 'table', name: 'messages' },
              { type: 'table', name: 'events' },
              { type: 'table', name: 'tasks' },
              { type: 'table', name: 'notifications' },
              { type: 'table', name: 'tags' },
              { type: 'table', name: 'categories' },
              { type: 'table', name: 'teams' },
              { type: 'table', name: 'articles' },
              { type: 'table', name: 'audit_logs' },
              { type: 'storage', name: 'buckets' }
            ];

            async function scanAll() {
              console.log('📡 Connecting to:', supabaseUrl);
              console.log('🔍 Scanning all targets...\\n');

              let successCount = 0;
              let failCount = 0;
              const results = [];

              for (const target of candidates) {
                let status = '❌ FAIL';
                let detail = '';

                try {
                  let result;

                  if (target.type === 'storage') {
                    result = await supabase.storage.listBuckets();
                  } else {
                    result = await supabase.from(target.name).select('id').limit(1);
                  }

                  const error = result.error;

                  if (!error) {
                    status = '✅ OK';
                    successCount++;
                  } else {
                    const msg = error.message.toLowerCase();
                    detail = error.message;

                    if (msg.includes('permission denied') || msg.includes('policy')) {
                      status = '✅ OK (Access Denied)';
                      successCount++;
                    } else if (msg.includes('does not exist') || msg.includes('404') || msg.includes('schema cache') || msg.includes('not found')) {
                      status = '⚠️ NOT FOUND';
                      failCount++;
                    } else if (msg.includes('fetch failed') || msg.includes('connection refused') || msg.includes('network')) {
                      status = '❌ NETWORK ERROR';
                      failCount++;
                    } else {
                      status = '✅ OK (DB Responded)';
                      successCount++;
                    }
                  }
                } catch (err) {
                  status = '❌ CRITICAL';
                  detail = err.message;
                  failCount++;
                }

                const icon = status.startsWith('✅') ? '✅' : status.startsWith('⚠️') ? '⚠️' : '❌';
                const cleanStatus = status.replace(/^[✅⚠️❌]\s*/, '');
                console.log(\`\${icon} [\${target.type.toUpperCase().padEnd(7)}] \${target.name.padEnd(20)} → \${cleanStatus}\${detail ? ' | ' + detail : ''}\`);
                
                results.push({ target: target.name, type: target.type, status: cleanStatus, detail });
              }

              console.log('\\n' + '─'.repeat(50));
              console.log(\`📊 Summary: \${successCount} success, \${failCount} failed, \${candidates.length} total\`);
              console.log('─'.repeat(50));

              // 只要 live 表查询成功，就算保活成功
              const liveResult = results.find(r => r.target === 'live');
              if (liveResult && liveResult.status.startsWith('OK')) {
                console.log('🛡️ Keep-alive confirmed: live table is accessible.');
              } else if (successCount > 0) {
                console.log('🛡️ Keep-alive confirmed: at least one target responded.');
              } else {
                console.error('❌ Keep-alive failed! No targets responded.');
                process.exit(1);
              }
            }

            scanAll();
          "
