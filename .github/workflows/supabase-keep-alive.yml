name: Supabase Keep-Alive (Smart Scan)

on:
  workflow_dispatch:
  schedule:
    # 每天运行两次 (UTC 01:30 和 13:30)，确保活跃度覆盖全天
    - cron: '30 1,13 * * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ⚠️ 确保这里的名字与你 Secrets 的后缀一致 (SUPABASE_URL_PROJ1)
        project: ['PROJ1', 'PROJ2', 'PROJ3', 'PROJ4']
# ⚠️ 关键点：请确保这里的 'PROJ1', 'PROJ2' 等名字
        # 和你 GitHub Secrets 名称的后缀（如 SUPABASE_URL_PROJ1）完全一致！
        #PROJ1：n8npro-475525068
        #PROJ2：n8-151251860
        #PROJ3：umi-151251860
        #PROJ4：gally16@proton.me
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Smart Keep-Alive for ${{ matrix.project }}
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            
            // 1. 获取并清洗环境变量
            const supabaseUrl = (process.env.SUPABASE_URL || '').trim();
            const supabaseKey = (process.env.SUPABASE_KEY || '').trim();

            if (!supabaseUrl || !supabaseKey) {
              console.error('❌ Missing URL or Key. Check GitHub Secrets.');
              process.exit(1);
            }

            // 2. 初始化客户端
            const supabase = createClient(supabaseUrl, supabaseKey, {
              auth: { persistSession: false },
              db: { schema: 'public' }
            });

            // 3. 定义扫描目标列表 
            // 🌟 修改点：常用表在前，Storage在最后做保底
            const candidates = [
              { type: 'table', name: 'users' },     // 最常见的表
              { type: 'table', name: 'profiles' },
              { type: 'table', name: 'todos' },
              { type: 'table', name: 'posts' },
              { type: 'table', name: 'projects' },
              { type: 'table', name: 'settings' },
              { type: 'table', name: 'items' },
              { type: 'table', name: 'orders' },
              { type: 'table', name: 'products' },
              { type: 'table', name: 'logs' },
              { type: 'table', name: 'comments' },
              { type: 'table', name: 'messages' },
              { type: 'table', name: 'events' },
              { type: 'table', name: 'tasks' },
              { type: 'table', name: 'notifications' },
              { type: 'table', name: 'tags' },
              { type: 'table', name: 'categories' },
              { type: 'table', name: 'teams' },
              { type: 'table', name: 'articles' },
              { type: 'table', name: 'audit_logs' },
              { type: 'storage', name: 'buckets' }  // 🛡️ 保底：如果上面的表都没有，这行99%能成功
            ];

            async function scanAndWake() {
              console.log('📡 Connecting to:', supabaseUrl);
              console.log('🔍 Starting scan...');

              for (const target of candidates) {
                try {
                  let error = null;

                  // --- 尝试探测 ---
                  if (target.type === 'storage') {
                    const res = await supabase.storage.listBuckets();
                    error = res.error;
                  } else {
                    // 查询表的一行数据 (limit 1)
                    const res = await supabase.from(target.name).select('id').limit(1);
                    error = res.error;
                  }

                  // --- 结果判定 ---
                  
                  // 1. 成功 (无错误) -> 完美保活
                  if (!error) {
                    console.log('✅ Alive! Query successful on: [' + target.type + '] ' + target.name);
                    return; // 结束整个脚本
                  }

                  const msg = error.message.toLowerCase();

                  // 2. 权限不足 (Permission denied) -> 完美保活
                  // 只要数据库返回权限错误，说明表存在且数据库是活的
                  if (msg.includes('permission denied') || msg.includes('policy')) {
                    console.log('✅ Alive! (Access Denied confirms DB is up): ' + target.name);
                    return; // 结束整个脚本
                  }

                  // 3. 表不存在 (Does not exist / 404) -> 继续尝试下一个
                  if (msg.includes('does not exist') || msg.includes('404')) {
                    console.log('⚠️ Target not found: ' + target.name + ' -> trying next...');
                    continue; 
                  }

                  // 4. 网络层致命错误 (Fetch failed) -> 项目可能已暂停
                  if (msg.includes('fetch failed') || msg.includes('connection refused')) {
                    throw new Error('FATAL: Connection failed. Is the project PAUSED? ' + msg);
                  }

                  // 5. 其他未知数据库错误 -> 说明连上了，算保活成功
                  console.log('✅ Alive! (DB responded with error): ' + msg);
                  return;

                } catch (err) {
                  console.error('❌ Critical Error:', err.message);
                  process.exit(1);
                }
              }

              // 循环走完都没 return，说明所有表都不存在
              console.error('❌ Scan failed! None of the 20 common tables exist.');
              process.exit(1);
            }

            scanAndWake();
          "
