name: Supabase Keep-Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1,4'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ⚠️ 关键点：请确保这里的 'PROJ1', 'PROJ2' 等名字
        # 和你 GitHub Secrets 名称的后缀（如 SUPABASE_URL_PROJ1）完全一致！
        project: ['PROJ1', 'PROJ2'] # <-- 根据你的项目修改这里
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # ✅ 已更新为 Supabase 推荐的 Node.js 版本
          node-version: '20'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Run Supabase Keep-Alive Script for ${{ matrix.project }}
        env:
          SUPABASE_URL: ${{ secrets[format('SUPABASE_URL_{0}', matrix.project)] }}
          SUPABASE_KEY: ${{ secrets[format('SUPABASE_KEY_{0}', matrix.project)] }}
        run: |
          node -e "
            const { createClient } = require('@supabase/supabase-js');
            const supabaseUrl = process.env.SUPABASE_URL;
            const supabaseKey = process.env.SUPABASE_KEY;

            if (!supabaseUrl || !supabaseKey) {
              console.error('Supabase URL or Key is missing. Please check your GitHub repository secrets.');
              process.exit(1);
            }

            console.log('Pinging project at:', supabaseUrl.substring(0, 25) + '...');

            const supabase = createClient(supabaseUrl, supabaseKey);

            async function keepAlive() {
              const { error, count } = await supabase.from('pg_catalog.pg_database').select('*', { count: 'exact', head: true });
              
              if (error) {
                console.error('Error pinging Supabase:', error.message);
                process.exit(1);
              } else {
                console.log('Successfully pinged project. DB count (from pg_database):', count);
              }
            }

            keepAlive();
          "
