name: Supabase Projects Keepalive

on:
  # 每7天执行一次
  schedule:
    - cron: '0 0 */7 * *'
  
  # 手动触发工作流
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - name: "Project1"
            url: "${{ secrets.SUPABASE_PROJECT1_URL }}"
            service_role_key: "${{ secrets.SUPABASE_PROJECT1_SERVICE_ROLE }}"
          - name: "Project2"
            url: "${{ secrets.SUPABASE_PROJECT2_URL }}"
            service_role_key: "${{ secrets.SUPABASE_PROJECT2_SERVICE_ROLE }}"
          # 可以继续添加更多项目
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Supabase CLI
      run: |
        curl -sL https://supabase.com/docs/guides/cli/getting-started | bash
        supabase --version

    - name: Keepalive Project ${{ matrix.project.name }}
      env:
        SUPABASE_URL: ${{ matrix.project.url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ matrix.project.service_role_key }}
      run: |
        # 方法1：直接执行查询
        supabase sql \
          -P "SELECT NOW() AS keepalive_timestamp;" \
          --command

        # 方法2：创建一个简单的测试表
        supabase sql << EOF
        CREATE TABLE IF NOT EXISTS keepalive_log (
          id SERIAL PRIMARY KEY,
          created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
        );

        INSERT INTO keepalive_log DEFAULT VALUES;
        EOF

    - name: Send Status Notification
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const status = '${{ job.status }}'
          const projectName = '${{ matrix.project.name }}'
          
          if (status === 'success') {
            console.log(`✅ Keepalive successful for ${projectName}`)
          } else {
            console.log(`❌ Keepalive failed for ${projectName}`)
          }

  notify:
    needs: [keepalive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack/Discord Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.keepalive.result }}
          text: |
            Supabase Projects Keepalive Status
            Project(s) Checked
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # 可选的通知渠道
